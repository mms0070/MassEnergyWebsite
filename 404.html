<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Mass Energy</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=3">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 2.5rem var(--gutter); background: var(--surface-tint); text-align: center; }
    .not-found__card { width: min(100%, 34rem); padding: clamp(2rem, 1.5rem + 3vw, 3.25rem); border: 1px solid var(--border); border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow-lg); }
    .not-found__logo { display: inline-block; margin-bottom: 1.75rem; }
    .not-found__logo img { height: 56px; width: auto; }
    .not-found__code { margin-bottom: 0.5rem; color: var(--accent-strong); font-family: var(--font-label); font-size: 0.8rem; font-weight: 600; letter-spacing: var(--tracking-label); }
    .not-found h1 { margin-bottom: 0.75rem; font-size: var(--text-3xl); font-stretch: var(--stretch-display); line-height: 1.08; letter-spacing: -0.024em; }
    .not-found p { margin-bottom: 1.75rem; }
    .not-found__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__card">
      <a class="not-found__logo" href="/"><img src="/assets/brand/mass-energy-logo.svg" width="456" height="186" alt="Mass Energy home"></a>
      <p class="not-found__code">ERROR 404</p>
      <h1>We can't find that page</h1>
      <p>The page may have moved or the address may be mistyped. Head back to the home page, or contact us directly.</p>
      <div class="not-found__actions">
        <a class="btn btn--primary" href="/">Back to home</a>
        <a class="btn btn--secondary" href="tel:+923338219937">Call 0333-8219937</a>
      </div>
    </div>
  </main>
</body>
</html>
